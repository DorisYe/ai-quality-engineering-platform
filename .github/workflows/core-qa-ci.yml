name: Core QA CI

on:
  push:
    branches:
      - main
      - feature/m5-1-github-actions
      - feature/m5-2-ci-artifacts
      - feature/m5-3-quality-gates
  pull_request:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Select core CI or an isolated, intentionally failing artifact check'
        required: true
        default: core
        type: choice
        options:
          - core
          - controlled-defect

permissions:
  contents: read

jobs:
  core-tests:
    name: Required Quality Gates (Static + Unit/Integration + Core Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      FORCE_COLOR: '0'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # package-lock.json is not yet committed on the current project branch.
      # npm ci can replace npm install once a verified lockfile is checked in.
      - name: Install Node.js dependencies
        run: npm install --no-audit --no-fund

      - name: Static syntax checks (Backend + QA Portal)
        run: npm run check:static

      - name: Install Playwright Chromium and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Node.js unit and integration tests
        run: npm run test:unit-integration

      # TC-006 is a deliberately broken AUT demonstration; DIAG-001 is separate.
      # Required CI regression includes only TC-001 through TC-005.
      - name: Run Playwright core regression (TC-001 to TC-005)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_mode != 'controlled-defect' }}
        run: npm run test:core

      # Manual-only opt-in to validate HTML report + screenshot/video/trace uploads.
      # This deliberately fails because the AUT has the known TC-006 Reset Filters defect.
      # It never runs for pushes/PRs, and normal CI keeps its five clean tests.
      - name: Controlled defect artifact validation (TC-006, expected FAIL)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == 'controlled-defect' }}
        run: npx playwright test --grep "TC-006:"

      # 'always()' preserves diagnostic files even if core regression fails.
      # Successful runs have an HTML report; failure artifacts may be absent.
      - name: Upload Playwright HTML Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
